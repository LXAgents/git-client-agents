name: CI

# Runs only where it counts: pushes to master and pull requests into master. Stacked pull
# requests (base is another feature branch) are checked once they are retargeted to master.
on:
  push:
    branches: [master]
    paths-ignore: ['**.md', '.agents/**', 'wiki/**']
  pull_request:
    branches: [master]
    paths-ignore: ['**.md', '.agents/**', 'wiki/**']

# A newer push to the same pull request or branch cancels the older, now pointless run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
